# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/jkm-mpl
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --python python --locked --group validation
      - name: Lint with flake8
        run: uv run --locked --group validation flake8 . --exclude=.venv,venv,.git --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with pytest
        run: |
          uv run --locked --group validation python -m pytest -q
      - run: uv run --locked --group validation python -m validation.conformance
      - run: uv run --locked --group validation python -m validation.mapk_intervention
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.python-version }}
          path: validation/results/
